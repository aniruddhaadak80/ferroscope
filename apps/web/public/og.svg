      <stop offset="0%" stop-color="#f0a63c" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f0a63c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="1040" cy="240" r="300" fill="url(#og-glow)"/>
  <circle cx="1040" cy="240" r="120" stroke="#f0a63c" stroke-opacity="0.35"/>
