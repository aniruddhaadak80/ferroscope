  <text x="70" y="380" fill="#f0a63c" font-family="Georgia, serif" font-size="76" letter-spacing="-3">before the breach does.</text>
  <text x="72" y="444" fill="#9a9b9e" font-family="system-ui, sans-serif" font-size="21">27 incidents. Declare your stack. Rank the fixes by risk removed per minute.</text>

