    <g><line x1="1308" y1="306" x2="1250" y2="430" stroke="#f0a63c" stroke-opacity="0.35" stroke-dasharray="4 5"/><circle cx="1250" cy="430" r="14" fill="#f0a63c" fill-opacity="0.18" stroke="#f0a63c"/></g>
    <g><line x1="1308" y1="306" x2="1206" y2="210" stroke="#f0a63c" stroke-opacity="0.35" stroke-dasharray="4 5"/><circle cx="1206" cy="210" r="16" fill="#e5644a" fill-opacity="0.18" stroke="#e5644a"/></g>
    <g><line x1="1308" y1="306" x2="1370" y2="456" stroke="#f0a63c" stroke-opacity="0.35" stroke-dasharray="4 5"/><circle cx="1370" cy="456" r="18" fill="#f0a63c" fill-opacity="0.18" stroke="#f0a63c"/></g>
