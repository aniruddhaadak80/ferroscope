version: 2

updates:
  # The repo installs with Bun and ships a bun.lock, so the npm ecosystem refuses
  # to run ("npm_and_yarn cannot update bun.lock"). Bun is the supported updater.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      next:
        patterns: ["next", "eslint-config-next", "react", "react-dom"]
      tooling:
        patterns: ["typescript", "@biomejs/*", "turbo", "vitest", "@playwright/*"]
    ignore:
      # Major upgrades land deliberately, with a migration note in the changelog.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
