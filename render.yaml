# Render blueprint. Push the repo, then "New > Blueprint" and point it here.
services:
  - type: web
    name: ferroscope
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_SIM_SEED
        value: "2718"
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
