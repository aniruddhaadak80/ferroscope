# Deploy with:
#   fly launch --no-deploy --copy-config --name ferroscope
#   fly deploy
app = "ferroscope"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_PUBLIC_SIM_SEED = "2718"
  NEXT_PUBLIC_SITE_URL = "https://ferroscope.fly.dev"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
